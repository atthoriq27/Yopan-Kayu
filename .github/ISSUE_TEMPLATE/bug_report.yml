name: 🐛 Laporan Bug
description: Buat laporan untuk membantu kami memperbaiki kesalahan atau kendala teknis.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Terima kasih telah meluangkan waktu untuk melaporkan kendala pada platform Yopan Kayu!
  - type: textarea
    id: description
    attributes:
      label: Deskripsi Kendala
      description: Jelaskan kendala yang dialami secara singkat dan jelas.
      placeholder: Contoh halaman detail produk tidak menampilkan foto utama...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah-Langkah Mereproduksi
      description: Urutan tindakan yang memicu terjadinya kendala.
      value: |
        1. Buka halaman '...'
        2. Klik tombol '...'
        3. Lihat kesalahan yang muncul
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang Diharapkan
      description: Apa yang seharusnya terjadi?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Perangkat / Peramban
      options:
        - Google Chrome (Desktop)
        - Mozilla Firefox (Desktop)
        - Safari (macOS / iOS)
        - Mobile Browser (Android Chrome)
        - Lainnya
    validations:
      required: true
